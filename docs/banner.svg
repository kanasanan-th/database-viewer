<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 64" width="960" height="384" shape-rendering="crispEdges" role="img" aria-label="Pixel-art desk at night: a glowing CRT monitor scrolling code, a steaming mug and light through window blinds">
<title>Schema Studio — late night at the schema desk</title>
<style>
.blink { animation: blink 1s steps(1) infinite }
.blink-slow { animation: blink 3.4s steps(1) infinite }
.led { animation: blink 2.2s steps(1) infinite }
.led-2 { animation: blink 3.1s steps(1) infinite; animation-delay: .7s }
@keyframes blink { 50% { opacity: 0 } }
.pulse { animation: pulse 4.5s ease-in-out infinite }
@keyframes pulse { 50% { opacity: .45 } }
.shaft { animation: pulse 7s ease-in-out infinite }
.scroll { animation: scroll 3.2s steps(8) infinite }
@keyframes scroll { to { transform: translateY(-8px) } }
.steam { animation: rise 3s linear infinite; opacity: 0 }
@keyframes rise { 0% { transform: translateY(0); opacity: 0 } 25% { opacity: .75 } 100% { transform: translateY(-9px); opacity: 0 } }
.dust { animation: drift 9s linear infinite; opacity: 0 }
@keyframes drift { 0% { transform: translate(0, 0); opacity: 0 } 15% { opacity: .85 } 85% { opacity: .85 } 100% { transform: translate(7px, -16px); opacity: 0 } }
.flicker { animation: flicker 6s steps(1) infinite }
@keyframes flicker { 0%, 100% { opacity: 0 } 92% { opacity: .025 } 94% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } .steam, .dust { opacity: 0 } }
</style>
